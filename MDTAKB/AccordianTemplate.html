<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
  <script type="module" src="https://js.arcgis.com/calcite-components/1.1.0/calcite.esm.js"></script>
  <link rel="stylesheet" type="text/css" href="https://js.arcgis.com/calcite-components/1.1.0/calcite.css" />
</head>

<body>

  <calcite-accordion>
    <calcite-accordion-item description="Yachts, boats, and dinghies" heading="Watercraft" icon-start="chevron-down">
        <calcite-notice open>
            <div slot="message">Recommended for coastal use</div>
        </calcite-notice>
    </calcite-accordion-item>
    <calcite-accordion-item icon-start="chevron-down" heading="Automobiles" description="Cars, trucks, and buses">
        <calcite-notice open>
            <div slot="message">A good choice for inland adventure</div>
        </calcite-notice>
    </calcite-accordion-item>
    <calcite-accordion-item icon-start="chevron-down" heading="Aircrafts" description="Planes, helicopters, and jets">
        <calcite-notice open>
            <div slot="message">Cross continents quickly</div>
        </calcite-notice>
    </calcite-accordion-item>
</calcite-accordion>

</body>

</html>
